name: hkotuner
options:
  bundleIdPrefix: uk.hkot
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "5"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
targets:
  hkotuner:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: Support/Resolver
        type: folder
        buildPhase: resources
      - path: Support/PythonRuntime/app_packages
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Support/PythonRuntime/Python.xcframework
        embed: true
    postBuildScripts:
      - name: Install embedded Python modules
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        showEnvVars: false
        script: |
          set -e
          export EXPANDED_CODE_SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          export CODESIGNING_FOLDER_PATH="${CODESIGNING_FOLDER_PATH:-$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME}"
          framework=Support/PythonRuntime/Python.xcframework
          source "$PROJECT_DIR/$framework/build/utils.sh"
          install_python "$framework" Resolver app_packages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.hkot.hkotuner
        PRODUCT_NAME: hkotuner
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Support/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Net/PythonAudioBridge.h
        HEADER_SEARCH_PATHS: '$(inherited) "$(BUILT_PRODUCTS_DIR)/Python.framework/Headers"'
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: hkotuner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [uk.hkot.hkotuner.lan-sync]
        NSBonjourServices: [_hkotuner-sync._tcp]
        NSLocalNetworkUsageDescription: hkotuner синхронизирует библиотеку и профиль с твоим компьютером по Wi-Fi.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: uk.hkot.hkotuner.share
            CFBundleURLSchemes: [hkotuner]
        CFBundleDocumentTypes:
          - CFBundleTypeName: hkotuner playlist
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [uk.hkot.hkplaylist]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: uk.hkot.hkplaylist
            UTTypeDescription: hkotuner playlist
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [hkplaylist]
        ITSAppUsesNonExemptEncryption: false
  hkotunerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: hkotuner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: uk.hkot.hkotuner.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/hkotuner.app/hkotuner
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  hkotuner:
    build:
      targets:
        hkotuner: all
        hkotunerTests: [test]
    test:
      targets:
        - hkotunerTests
