name: hkotuner
options:
  bundleIdPrefix: uk.hkot
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
targets:
  hkotuner:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.hkot.hkotuner
        PRODUCT_NAME: hkotuner
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Support/Info.plist
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: hkotuner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: uk.hkot.hkotuner.share
            CFBundleURLSchemes: [hkotuner]
        CFBundleDocumentTypes:
          - CFBundleTypeName: hkotuner playlist
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [uk.hkot.hkplaylist]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: uk.hkot.hkplaylist
            UTTypeDescription: hkotuner playlist
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [hkplaylist]
        ITSAppUsesNonExemptEncryption: false
  hkotunerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: hkotuner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: uk.hkot.hkotuner.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/hkotuner.app/hkotuner
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  hkotuner:
    build:
      targets:
        hkotuner: all
        hkotunerTests: [test]
    test:
      targets:
        - hkotunerTests
